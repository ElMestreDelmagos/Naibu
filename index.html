<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Naibu</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="background"></div>

  <div id="flash"></div>

  <div id="circle"></div>

  <div id="dialogue"></div>

  <div id="nameInputArea">

  <input
    type="text"
    id="nameInput"
    placeholder="Digite seu nome..."
  />

  <button id="sendName">
    Confirmar
  </button>

</div>

<div id="choices"></div>

  <div id="envelope">
    ✉
  </div>
  
  <div id="errorScreen">

  <div id="letter">

    <div class="paper">

    <div id="letterText">

      Finja que aqui está escrito uma carta muito FODA de aniversário.

    <div id="letterButtons">

      <button id="closeLetter">
        Fechar carta
      </button>

      <button id="talkNaibu">
        Voltar a falar com Naibu
      </button>

    </div>

  </div>

</div>

</div>
  </div>
  <div id="secretArea">

  <button id="starButton">
    ⭐
  </button>

  <div id="secretOptions">

    <button id="messageNaibu">
      Mandar uma carta para Naibu com perguntas.
    </button>

  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  

  <script src="script.js"></script>
  
</body>

</html>
